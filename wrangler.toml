# MUZERO's official web surface is a static Vite build on Cloudflare Pages:
#   mu0.app -> Pages project "mu0-app" -> dist/
#
# The Cloudflare account id is exported by Makefile as CLOUDFLARE_ACCOUNT_ID
# because Pages configuration files do not support the Worker-only account_id
# field. R2 *write* credentials live in the local rclone `r2:` remote / CI env
# — NEVER here.
# Desktop release artifact uploads still go through rclone (see
# scripts/publish-release.mjs); Wrangler is used for Pages deployment and
# bucket-level R2 setup commands only. See docs/deploy/mu0-app-release.md.
"$schema" = "./node_modules/wrangler/config-schema.json"
name = "mu0-app"
compatibility_date = "2026-06-12"
pages_build_output_dir = "./dist"
