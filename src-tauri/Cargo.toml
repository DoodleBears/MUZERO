[package]
name = "muzero"
version = "1.1.0"
description = "MUZERO — local-first AI DJ music player"
authors = ["MUZERO"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` library is what mobile (iOS/Android) entry points link against.
# See https://v2.tauri.app/start/migrate/from-tauri-1/
[lib]
name = "muzero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds / when a dev server is not specified,
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
